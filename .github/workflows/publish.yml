name: Publish Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run package

      - name: Package extension
        run: npx @vscode/vsce package

      - name: Create namespace (if not exists)
        run: npx ovsx create-namespace YiEvan -p ${{ secrets.OPEN_VSX_TOKEN }}

      - name: Publish to Open VSX
        run: npx ovsx publish remotetest-*.vsix -p ${{ secrets.OPEN_VSX_TOKEN }}
